<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        /* Paleta Dark Charcoal + Vermelho */
                        dark: {
                            root: '#111114',
                            sidebar: '#16161A',
                            primary: '#1C1C21',
                            card: '#242429',
                            elevated: '#2F2F36',
                            input: '#1A1A1F',
                            border: '#2E2E35',
                            hover: '#2A2A30',
                        },
                        crimson: {
                            DEFAULT: '#BF2B2B',
                            hover: '#A82424',
                            light: 'rgba(191,43,43,0.15)',
                            text: '#FF7070',
                        },
                        /* Prioridades tonificadas para dark */
                        priority: {
                            low: '#16A34A',
                            medium: '#CA8A04',
                            high: '#DC2626',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

    "react": "https://esm.sh/react@^19.2.3"
  }
}
